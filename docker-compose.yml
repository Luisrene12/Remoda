services:
  backend:
    build:
      context: .
      dockerfile: docker/backend/Dockerfile
    container_name: remoda_backend
    restart: unless-stopped
    ports:
      - "8000:10000"
    environment:
      APP_ENV: local
      APP_DEBUG: "true"
      DB_CONNECTION: pgsql
      DB_HOST: aws-0-us-east-1.pooler.supabase.com
      DB_PORT: 5432
      DB_DATABASE: postgres
      DB_USERNAME: postgres.widcbgueidgqjtsnyqys
      DB_PASSWORD: Remoda123..
      DB_SSLMODE: require
    volumes:
      - ./backend:/var/www/html
    networks:
      - remoda_network

  frontend:
    build:
      context: ./frontend
      dockerfile: ../docker/frontend/Dockerfile
    container_name: remoda_frontend
    restart: unless-stopped
    ports:
      - "5173:5173"
    environment:
      - CHOKIDAR_USEPOLLING=true
      - WATCHPACK_POLLING=true
      - VITE_API_TARGET=http://backend:10000
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend
    networks:
      - remoda_network

networks:
  remoda_network:
    driver: bridge
